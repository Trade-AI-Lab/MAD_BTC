# init config
crypto_currency = "BTCUSDT"
time = "4h"
exchange = "binance"
initial_capital = 1000
broker = "binance"

[strategy]
name = "momentum_strategy"
x = 5
y = 57
ratio_method = "ma_ratio"

[multi]
list_brokers = ["binance"]
list_crypto_currency = ["BTCUSDT", "ETHUSDT", "ADAUSDT", "BNBUSDT", "MATICUSDT", "DOTUSDT"]
list_time = ["1h", "4h", "1d"]

[wfo]
# Minimum history required before the first OOS window (months)
train_months = 12
# Length of each OOS validation window (months)
val_months = 3
# Number of rolling folds
n_splits = 5